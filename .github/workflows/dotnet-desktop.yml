name: Release

on:
  push:
    tags:
      - "v*"          # e.g. v1.0.0
  workflow_dispatch:   # allows a manual test run (builds artifacts, does not publish a release)

permissions:
  contents: write      # required to create the GitHub Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compute version
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then TAG="v0.0.0-dev"; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # 1) .NET Framework 4.8 build: runs on any Windows machine that has .NET Framework 4.8 (built into Windows 10 1903+/Server 2022)
      - name: Publish net48
        shell: bash
        run: dotnet publish CertScan.csproj -f net48 -c Release -p:Version=${{ steps.ver.outputs.version }} -p:DebugType=None -o out/net48

      # 2) .NET 8 self-contained single file: nothing to install on the target machine
      - name: Publish net8 self-contained (win-x64)
        shell: bash
        run: dotnet publish CertScan.csproj -f net8.0 -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:Version=${{ steps.ver.outputs.version }} -o out/win-x64

      - name: Package and checksum
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item README.md, README.fa.md -Destination out/net48/ -ErrorAction SilentlyContinue
          Copy-Item README.md, README.fa.md -Destination out/win-x64/ -ErrorAction SilentlyContinue
          Compress-Archive -Path out/net48/*   -DestinationPath "dist/CertScan-$tag-net48.zip" -Force
          Compress-Archive -Path out/win-x64/* -DestinationPath "dist/CertScan-$tag-win-x64.zip" -Force
          Get-ChildItem dist/*.zip | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CertScan-${{ steps.ver.outputs.tag }}
          path: dist/*

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
